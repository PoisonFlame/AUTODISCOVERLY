# Example deployment behind an existing reverse proxy (Traefik/Caddy/nginx)
# that terminates TLS and forwards plain HTTP to this container. Because
# every handler resolves the target domain from the email address in the
# request itself (not from the Host header), a single catch-all vhost
# pointing every autodiscover.<domain>/autoconfig.<domain> hostname at this
# one container is enough — no per-domain routing rules needed here.
services:
  autodiscoverly:
    # Published by .github/workflows/docker-publish.yml on every push to
    # main (tag: latest) and on v*.*.* tags (tags: X.Y.Z, X.Y, X too) --
    # pin to a specific version tag instead of `latest` for anything you
    # care about not changing out from under you.
    image: ghcr.io/poisonflame/autodiscoverly:latest
    # Uncomment to build locally instead of pulling (e.g. testing an
    # unpublished change):
    # build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.yaml:/etc/autodiscoverly/config.yaml:ro
    # HEALTHCHECK is already baked into the image (see Dockerfile).
